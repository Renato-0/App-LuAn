<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Gastos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Gerenciador de Gastos</h1>
        <form id="expense-form" class="mb-4">
            <div class="row">
                <div class="col-md-3">
                    <input type="number" id="amount" class="form-control" placeholder="Valor (R$)" required>
                </div>
                <div class="col-md-3">
                    <input type="text" id="description" class="form-control" placeholder="Descrição" required>
                </div>
                <div class="col-md-3">
                    <select id="category" class="form-control" required>
                        <option value="">Categoria</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Outros">Outrs</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Adicionar</button>
                </div>
            </div>
        </form>
        <div class="row">
            <div class="col-md-6">
                <h3>Resumo Mensal</h3>
                <p>Total: R$ <span id="total">0.00</span></p>
                <canvas id="chart"></canvas>
            </div>
            <div class="col-md-6">
                <h3>Gastos Recentes</h3>
                <ul id="expense-list" class="list-group"></ul>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
