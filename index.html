<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Gastos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Gerenciador de Gastos</h1>
        
        <!-- Interface de Login -->
        <div id="login-interface" class="text-center mb-4">
    <h3>Login</h3>
    <form id="login-form" class="d-flex flex-column align-items-center">
        <div class="mb-3 w-100" style="max-width: 500px;">
            <input type="email" id="login-email" class="form-control" placeholder="Email" required>
        </div>
        <div class="mb-3 w-100" style="max-width: 500px;">
            <input type="password" id="login-password" class="form-control" placeholder="Senha" required>
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
        <button type="button" id="btn-register" class="btn btn-link">Registrar-se</button>
    </form>
    <div id="login-error" class="text-danger mt-2" style="display: none;"></div>
</div>
        
        <!-- Seleção de Mês -->
        <div id="month-selection" class="text-center mb-4" style="display: none;">
            <h3>Selecione o Mês</h3>
            <select id="selected-month" class="form-control d-inline-block w-auto mb-3" required>
                <option value="">Mês</option>
                <option value="1">Janeiro</option>
                <option value="2">Fevereiro</option>
                <option value="3">Março</option>
                <option value="4">Abril</option>
                <option value="5">Maio</option>
                <option value="6">Junho</option>
                <option value="7">Julho</option>
                <option value="8">Agosto</option>
                <option value="9">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
            </select>
            <br>
            <button id="btn-select-month" class="btn btn-primary">Selecionar Mês</button>
            <br>
            <button id="btn-logout" class="btn btn-secondary mt-3">Sair</button>
        </div>
        
        <!-- Interface Principal -->
        <div id="main-interface" style="display: none;">
            <!-- Navegação das Abas -->
            <ul class="nav nav-tabs mb-4" id="mainTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="saldo-tab" data-bs-toggle="tab" data-bs-target="#saldo-pane" type="button" role="tab" aria-controls="saldo-pane" aria-selected="true">
                        💰 Saldo
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="receita-despesa-tab" data-bs-toggle="tab" data-bs-target="#receita-despesa-pane" type="button" role="tab" aria-controls="receita-despesa-pane" aria-selected="false">
                        ➕ Receita/Despesa
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="transacoes-tab" data-bs-toggle="tab" data-bs-target="#transacoes-pane" type="button" role="tab" aria-controls="transacoes-pane" aria-selected="false">
                        📋 Transações
                    </button>
                </li>
            </ul>
            
            <!-- Conteúdo das Abas -->
            <div class="tab-content" id="mainTabsContent">
                <!-- Aba Saldo -->
                <div class="tab-pane fade show active" id="saldo-pane" role="tabpanel" aria-labelledby="saldo-tab">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-body">
                                    <h3 class="card-title text-center">Resumo Mensal</h3>
                                    <div class="text-center mb-3">
                                        <span class="badge bg-success fs-5">Receitas: R$ <span id="total-receitas">0.00</span></span>
                                    </div>
                                    <div class="text-center mb-3">
                                        <span class="badge bg-danger fs-5">Despesas: R$ <span id="total-despesas">0.00</span></span>
                                    </div>
                                    <div class="text-center">
                                        <span class="badge bg-primary fs-4">Saldo: R$ <span id="saldo">0.00</span></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <h3 class="card-title text-center">Gráfico de Gastos</h3>
                                    <canvas id="chart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Aba Receita/Despesa -->
                <div class="tab-pane fade" id="receita-despesa-pane" role="tabpanel" aria-labelledby="receita-despesa-tab">
                    <!-- Botões para Receita e Despesa -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <button id="btn-receita" class="btn btn-success w-100">Cadastrar Receita</button>
                        </div>
                        <div class="col-md-6">
                            <button id="btn-despesa" class="btn btn-danger w-100">Cadastrar Despesa</button>
                        </div>
                    </div>
                    
                    <!-- Formulário para Receita -->
                    <form id="receita-form" class="mb-4" style="display: none;">
                        <h3>Cadastrar Receita</h3>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <input type="text" id="receita-name" class="form-control" placeholder="Nome" required>
                            </div>
                            <div class="col-md-4">
                                <select id="receita-day" class="form-control" required>
                                    <option value="">Dia</option>
                                    <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                                    <option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option>
                                    <option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <input type="number" id="receita-amount" class="form-control" placeholder="Valor (R$)" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <input type="text" id="receita-description" class="form-control" placeholder="Descrição">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <button type="submit" class="btn btn-success w-100">Adicionar Receita</button>
                            </div>
                        </div>
                    </form>
                    
                    <!-- Formulário para Despesa -->
                    <form id="expense-form" class="mb-4" style="display: none;">
                        <h3>Cadastrar Despesa</h3>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <input type="text" id="name" class="form-control" placeholder="Nome" required>
                            </div>
                            <div class="col-md-4">
                                <select id="day" class="form-control" required>
                                    <option value="">Dia</option>
                                    <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                                    <option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option>
                                    <option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <input type="number" id="amount" class="form-control" placeholder="Valor (R$)" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <input type="text" id="description" class="form-control" placeholder="Descrição">
                            </div>
                           <div class="col-md-6">
                            <!-- Container principal -->
                            <div class="input-group mb-3">
                                <select id="category" class="form-control" required>
                                    <option value="" disabled selected>Selecione uma Categoria</option>
                                    <!-- As categorias do banco serão inseridas aqui pelo JS -->
                                    <option value="new">+ Nova Categoria</option>
                                </select>
                                
                                <!-- Botão para acionar a adição (opcional, pode ser só o input) -->
                                <button class="btn btn-outline-secondary" type="button" id="btn-add-category" style="display: none;">+</button>
                            </div>

                            <!-- Campo oculto para digitar nova categoria -->
                            <div id="new-category-area" class="input-group" style="display: none; margin-top: 5px;">
                                <input type="text" id="new-category-name" class="form-control" placeholder="Digite o nome da nova categoria">
                                <button class="btn btn-success" type="button" id="save-category-btn">Salvar</button>
                            </div>
                        </div>
                    </div>
                        <div class="row">
                            <div class="col-md-12">
                                <button type="submit" class="btn btn-danger w-100" >Adicionar Despesa</button>
                            </div>
                        </div>
                    </form>
                </div>
                
                <!-- Aba Transações -->
                <div class="tab-pane fade" id="transacoes-pane" role="tabpanel" aria-labelledby="transacoes-tab">
                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title text-center mb-4">Transações do Mês</h3>
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Data</th>
                                            <th>Tipo</th>
                                            <th>Nome</th>
                                            <th>Descrição</th>
                                            <th>Categoria</th>
                                            <th>Valor</th>
                                        </tr>
                                    </thead>
                                    <tbody id="transaction-list">
                                        <!-- Transações inseridas via JS -->
                                    </tbody>
                                </table>
                            </div>
                            <div id="no-transactions" class="text-center text-muted mt-3" style="display: none;">
                                Nenhuma transação encontrada para este mês.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Botão para mudar mês -->
            <div class="text-center mt-4">
                <button id="btn-change-month" class="btn btn-secondary">Mudar Mês</button>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
    <script src="sound-hover.js"></script>
</body>
</html>
